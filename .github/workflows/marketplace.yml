name: marketplace
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: doom
          POSTGRES_PASSWORD: doom_local_only
          POSTGRES_DB: doom_marketplace
        ports: ['5438:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      MARKETPLACE_INTEGRATION: '1'
      APP_ENVIRONMENT: local
      NODE_ENV: test
      DATABASE_URL: postgres://doom:doom_local_only@127.0.0.1:5438/doom_marketplace
      JWT_SECRET: local-ci-only-secret-never-for-deployment
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY_ID: doom_local
      S3_SECRET_ACCESS_KEY: doom_local_secret_change_me
      S3_QUARANTINE_BUCKET: doom-quarantine
      S3_PUBLISHED_BUCKET: doom-published
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm --prefix doom-cli ci
      - run: npm --prefix marketplace-api ci
      - run: npm --prefix marketplace-api run db:migrate
      - run: npm --prefix marketplace-api test
